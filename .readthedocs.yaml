# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-26.04
  tools:
    python: "3"
    nodejs: "24"
  apt_packages:
    - composer
    - php-cli
    - php-curl
    - php-xml
    - php-mbstring
    - php-zip
    - unzip
  jobs:
    post_install:
      - composer install --no-dev --no-interaction --no-progress --ignore-platform-req=ext-sqlite3
      - composer require --update-no-dev --prefer-dist --no-interaction --ignore-platform-req=ext-sqlite3 php-coord/datapack-africa:dev-master php-coord/datapack-antarctic:dev-master php-coord/datapack-arctic:dev-master php-coord/datapack-asia:dev-master php-coord/datapack-europe:dev-master php-coord/datapack-northamerica:dev-master php-coord/datapack-oceania:dev-master php-coord/datapack-southamerica:dev-master
      - cd playground && npm ci
    pre_build:
      - cd playground && npm run build

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  builder: html

# If using Sphinx, optionally build your docs in additional formats such as PDF
# Build all formats
formats: all

# Optionally declare the Python requirements required to build your docs
python:
  install:
    - method: uv
      command: sync
      path: docs
